<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kadir Bux Dental Lab & Clinic</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function MainApp() {
      // Current Page State (Default: 'dashboard')
      const [currentPage, setCurrentPage] = useState('dashboard');
      const [selectedPatient, setSelectedPatient] = useState(null);
      const [lang, setLang] = useState('English');

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [currentPage]);

      // Action Buttons List
      const actionButtons = [
        { id: 'new-patient', title: 'New Patient', icon: 'user-plus' },
        { id: 'patient-list', title: 'Patient List', icon: 'users' },
        { id: 'daily-folders', title: 'Daily Folders', icon: 'calendar' },
        { id: 'dental-chart', title: 'Dental Chart', icon: 'activity' },
        { id: 'prescription', title: 'Prescription', icon: 'file-text' },
        { id: 'medicines', title: 'Medicines', icon: 'pill' },
        { id: 'billing', title: 'Billing', icon: 'credit-card' },
        { id: 'reports', title: 'Reports', icon: 'bar-chart-2' },
        { id: 'backup', title: 'Backup', icon: 'database' },
        { id: 'settings', title: 'Settings', icon: 'settings' },
      ];

      const stats = [
        { label: 'Total Patients', value: '495' },
        { label: "Today's Patients", value: '3' },
        { label: "Today's Collection", value: '₹2,950' },
        { label: 'Pending Amount', value: '₹24,735' },
        { label: 'Monthly Income', value: '₹6,720' },
        { label: 'Total Collection', value: '₹2,78,890' },
        { label: 'Lab Cases Pending', value: '0' },
        { label: 'Completed Cases', value: '0' },
        { label: 'Appointments Today', value: '0' },
        { label: 'Low Stock', value: '0' },
      ];

      const todayPatients = [
        { id: 1, name: 'Nisha', phone: '8077245094', age: 30, amount: '₹600', balance: '₹150' },
        { id: 2, name: 'Shah Jahan', phone: '9897588692', age: 35, amount: '₹2,000', balance: '' },
        { id: 3, name: 'Muskan', phone: '7820050319', age: 39, amount: '₹350', balance: '' },
      ];

      // Open Patient Profile Page
      const openPatientProfile = (patient) => {
        setSelectedPatient(patient);
        setCurrentPage('patient-profile');
      };

      return (
        <div className="min-h-screen pb-10">
          {/* Top Navbar */}
          <header className="bg-white border-b px-4 py-2 flex items-center justify-between shadow-sm sticky top-0 z-20">
            <div className="flex items-center gap-3">
              {currentPage !== 'dashboard' && (
                <button 
                  onClick={() => setCurrentPage('dashboard')}
                  className="bg-slate-100 hover:bg-slate-200 text-slate-700 p-1.5 rounded-lg flex items-center gap-1 text-xs font-semibold"
                >
                  <i data-lucide="arrow-left" className="w-4 h-4"></i> Back
                </button>
              )}
              <div className="w-9 h-9 rounded-full bg-pink-500 text-white font-bold flex items-center justify-center text-base">
                K
              </div>
              <div>
                <h1 className="font-bold text-pink-600 text-sm leading-tight">Kadir Baksh</h1>
                <p className="text-[10px] text-gray-500">Dental Lab & Clinic</p>
              </div>
            </div>

            <div className="flex items-center gap-2 text-xs overflow-x-auto">
              <button 
                onClick={() => setCurrentPage('dashboard')}
                className={`px-3 py-1.5 rounded-full flex items-center gap-1 font-medium whitespace-nowrap ${
                  currentPage === 'dashboard' ? 'bg-pink-500 text-white' : 'text-gray-600'
                }`}
              >
                <i data-lucide="home" className="w-3.5 h-3.5"></i> Home
              </button>
              <button 
                onClick={() => setCurrentPage('patient-list')}
                className={`px-3 py-1.5 rounded-full flex items-center gap-1 font-medium whitespace-nowrap ${
                  currentPage === 'patient-list' ? 'bg-pink-500 text-white' : 'text-gray-600'
                }`}
              >
                <i data-lucide="users" className="w-3.5 h-3.5"></i> Patients
              </button>
              <button 
                onClick={() => setCurrentPage('new-patient')}
                className="text-gray-600 px-2 py-1.5 font-bold hover:text-pink-600"
              >
                + New
              </button>
            </div>
          </header>

          {/* MAIN DASHBOARD PAGE */}
          {currentPage === 'dashboard' && (
            <main className="max-w-4xl mx-auto p-4 space-y-6">
              {/* Banner Section */}
              <div className="text-center py-2">
                <div className="text-3xl font-extrabold text-red-600 tracking-wider mb-1">
                  KADIR <span className="text-red-700">Bux</span>
                </div>
                <div className="text-lg font-bold text-red-600 mb-1">कदीर बख्श डेंटल लैब</div>
                <div className="text-sm font-semibold text-red-700">قدیر بخش ڈینٹل لیب</div>

                <p className="text-xs text-gray-400 mt-3">Welcome 👋</p>
                <h2 className="text-xl font-bold text-purple-600">Patient Care, Your Priority</h2>
                
                <div className="inline-flex items-center gap-1 text-[11px] bg-emerald-50 text-emerald-600 border border-emerald-200 px-2.5 py-0.5 rounded-full mt-2">
                  <i data-lucide="sparkles" className="w-3 h-3"></i> AI assistant ready ✨
                </div>

                {/* Language Switcher */}
                <div className="flex justify-center gap-2 mt-3">
                  {['English', 'हिन्दी', 'اردو'].map((item) => (
                    <button 
                      key={item}
                      onClick={() => setLang(item)}
                      className={`px-3 py-1 rounded-full text-xs font-medium ${
                        lang === item ? 'bg-pink-500 text-white' : 'bg-gray-100 text-gray-600'
                      }`}
                    >
                      {item}
                    </button>
                  ))}
                </div>
              </div>

              {/* Action Grid (All Buttons Clickable) */}
              <div className="grid grid-cols-5 gap-2.5">
                {actionButtons.map((btn) => (
                  <button 
                    key={btn.id} 
                    onClick={() => setCurrentPage(btn.id)}
                    className="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2 hover:shadow-md hover:border-pink-200 transition active:scale-95"
                  >
                    <div className="w-10 h-10 rounded-full bg-sky-50 flex items-center justify-center text-sky-500">
                      <i data-lucide={btn.icon} className="w-5 h-5"></i>
                    </div>
                    <span className="text-[11px] font-medium text-pink-500 text-center">{btn.title}</span>
                  </button>
                ))}
              </div>

              {/* Stats Grid */}
              <div className="grid grid-cols-5 gap-2.5">
                {stats.map((stat, index) => (
                  <div key={index} className="bg-white p-2.5 rounded-xl border border-gray-100 shadow-sm text-center">
                    <p className="text-[10px] text-gray-400 font-medium mb-1 leading-tight">{stat.label}</p>
                    <p className="text-sm font-bold text-slate-700">{stat.value}</p>
                  </div>
                ))}
              </div>

              {/* Today's Patients List */}
              <div className="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
                <h3 className="text-sm font-bold text-purple-600 mb-3 flex items-center gap-2">
                  <span>📊</span> Today's Patients ({todayPatients.length})
                </h3>

                <div className="space-y-2">
                  {todayPatients.map((patient) => (
                    <div 
                      key={patient.id} 
                      onClick={() => openPatientProfile(patient)}
                      className="flex items-center justify-between border-b border-gray-100 pb-2 text-xs cursor-pointer hover:bg-slate-50 p-2 rounded-lg transition"
                    >
                      <div className="flex items-center gap-3">
                        <span className="w-5 h-5 rounded-full bg-purple-500 text-white flex items-center justify-center text-[10px] font-bold">
                          {patient.id}
                        </span>
                        <div>
                          <p className="font-semibold text-slate-800">{patient.name}</p>
                          <p className="text-[10px] text-gray-400">{patient.phone} • {patient.age} yrs</p>
                        </div>
                      </div>

                      <div className="text-right">
                        <p className="font-bold text-emerald-500">{patient.amount}</p>
                        {patient.balance && (
                          <p className="text-[10px] text-red-500">बाकी {patient.balance}</p>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          )}

          {/* PAGE: PATIENT PROFILE */}
          {currentPage === 'patient-profile' && selectedPatient && (
            <main className="max-w-4xl mx-auto p-4 space-y-4">
              <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
                <div className="flex items-start gap-4">
                  <div className="w-14 h-14 rounded-full bg-pink-100 text-pink-600 font-bold text-xl flex items-center justify-center">
                    {selectedPatient.name.charAt(0)}
                  </div>
                  <div>
                    <h2 className="text-lg font-bold text-slate-800">{selectedPatient.name}</h2>
                    <p className="text-xs text-slate-500">Phone: {selectedPatient.phone} | Age: {selectedPatient.age}</p>
                    <p className="text-xs text-emerald-600 font-semibold mt-1">Paid: {selectedPatient.amount}</p>
                  </div>
                </div>
              </div>

              <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <h3 className="font-bold text-sm text-slate-700 mb-2">Options & Actions:</h3>
                <div className="flex gap-2">
                  <button onClick={() => setCurrentPage('prescription')} className="bg-purple-600 text-white px-3 py-1.5 rounded-lg text-xs">Create Prescription</button>
                  <button onClick={() => setCurrentPage('billing')} className="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs">Generate Bill</button>
                </div>
              </div>
            </main>
          )}

          {/* GENERIC PAGE PLACEHOLDER (New Patient, Billing, Prescriptions, etc.) */}
          {currentPage !== 'dashboard' && currentPage !== 'patient-profile' && (
            <main className="max-w-4xl mx-auto p-6 space-y-4 text-center">
              <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                <div className="w-12 h-12 rounded-full bg-pink-100 text-pink-600 flex items-center justify-center mx-auto mb-3">
                  <i data-lucide="layers" className="w-6 h-6"></i>
                </div>
                <h2 className="text-lg font-bold text-slate-800 capitalize">{currentPage.replace('-', ' ')} Page</h2>
                <p className="text-xs text-slate-400 mt-1">Yeh page abhi ready hai. Yahan aap apna form ya data UI add kar sakte hain.</p>
                <button 
                  onClick={() => setCurrentPage('dashboard')}
                  className="mt-4 bg-pink-500 text-white text-xs px-4 py-2 rounded-xl font-medium"
                >
                  Back to Dashboard
                </button>
              </div>
            </main>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MainApp />);
  </script>
</body>
</html>
