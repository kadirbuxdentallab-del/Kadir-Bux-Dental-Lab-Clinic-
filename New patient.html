<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Patient Registration - Kadir Bux Dental Lab & Clinic</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function NewPatientForm() {
      const [formData, setFormData] = useState({
        patientId: 'P-' + Math.floor(1000 + Math.random() * 9000),
        fullName: '',
        age: '',
        gender: 'Male',
        mobile: '',
        whatsapp: '',
        address: '',
        bloodGroup: '',
        patientPhoto: null, // Photo Base64 URL
        medicalHistory: [],
        otherMedical: '',
        chiefComplaint: '',
        toothNumber: '',
        treatmentPlan: '',
        doctorName: 'Dr. Kadir Baksh',
        totalFee: '',
        advancePaid: '',
        paymentMode: 'Cash'
      });

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [formData.patientPhoto]);

      // Handle Image Selection / Camera Capture
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setFormData({ ...formData, patientPhoto: reader.result });
          };
          reader.readAsDataURL(file);
        }
      };

      // Remove / Change Photo
      const handleRemovePhoto = () => {
        setFormData({ ...formData, patientPhoto: null });
      };

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData({ ...formData, [name]: value });
      };

      const handleCheckboxChange = (disease) => {
        const updated = formData.medicalHistory.includes(disease)
          ? formData.medicalHistory.filter(item => item !== disease)
          : [...formData.medicalHistory, disease];
        setFormData({ ...formData, medicalHistory: updated });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        alert('Patient Registered Successfully!\nPatient ID: ' + formData.patientId);
        console.log('Saved Patient Data:', formData);
      };

      return (
        <div className="min-h-screen pb-10">
          {/* Header Bar */}
          <header className="bg-white border-b px-4 py-3 flex items-center justify-between shadow-sm sticky top-0 z-20">
            <div className="flex items-center gap-3">
              <button className="bg-slate-100 hover:bg-slate-200 text-slate-700 p-1.5 rounded-lg flex items-center gap-1 text-xs font-semibold">
                <i data-lucide="arrow-left" className="w-4 h-4"></i> Back
              </button>
              <div>
                <h1 className="font-bold text-slate-800 text-base leading-tight">New Patient Registration</h1>
                <p className="text-xs text-slate-400">Kadir Bux Dental Lab & Clinic</p>
              </div>
            </div>
            <span className="bg-pink-100 text-pink-600 px-3 py-1 rounded-full text-xs font-bold">
              ID: {formData.patientId}
            </span>
          </header>

          <main className="max-w-3xl mx-auto p-4">
            <form onSubmit={handleSubmit} className="space-y-6">

              {/* SECTION 1: Personal Details & Photo Upload */}
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h2 className="text-sm font-bold text-purple-600 flex items-center gap-2 border-b pb-2">
                  <i data-lucide="user" className="w-4 h-4"></i> 1. Basic Details & Photo
                </h2>

                {/* Photo Upload Card */}
                <div className="flex flex-col sm:flex-row items-center gap-4 bg-slate-50 p-4 rounded-xl border border-dashed border-slate-300">
                  <div className="relative w-24 h-24 rounded-full bg-slate-200 border-2 border-pink-500 overflow-hidden flex items-center justify-center shrink-0 shadow-inner">
                    {formData.patientPhoto ? (
                      <img src={formData.patientPhoto} alt="Patient" className="w-full h-full object-cover" />
                    ) : (
                      <i data-lucide="user" className="w-10 h-10 text-slate-400"></i>
                    )}
                  </div>

                  <div className="flex flex-col items-center sm:items-start gap-2 text-center sm:text-left">
                    <p className="text-xs font-semibold text-slate-700">Patient Photo (Profile Picture)</p>
                    <p className="text-[10px] text-slate-400">Camera se photo kheenchein ya Gallery se upload karein</p>
                    
                    <div className="flex gap-2">
                      <label className="bg-pink-500 hover:bg-pink-600 text-white text-xs font-medium px-3 py-1.5 rounded-lg cursor-pointer flex items-center gap-1 shadow-sm transition">
                        <i data-lucide="camera" className="w-3.5 h-3.5"></i> 
                        {formData.patientPhoto ? 'Change Photo' : 'Upload / Take Photo'}
                        <input 
                          type="file" 
                          accept="image/*" 
                          capture="environment"
                          onChange={handleImageUpload} 
                          className="hidden" 
                        />
                      </label>

                      {formData.patientPhoto && (
                        <button 
                          type="button" 
                          onClick={handleRemovePhoto}
                          className="bg-red-50 hover:bg-red-100 text-red-600 text-xs font-medium px-2.5 py-1.5 rounded-lg flex items-center gap-1 transition"
                        >
                          <i data-lucide="trash-2" className="w-3.5 h-3.5"></i> Remove
                        </button>
                      )}
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-600 mb-1">Full Name (Pura Naam) *</label>
                    <input 
                      type="text" 
                      name="fullName" 
                      required 
                      value={formData.fullName} 
                      onChange={handleInputChange} 
                      placeholder="e.g. Rahul Sharma" 
                      className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Age (Umar) *</label>
                      <input 
                        type="number" 
                        name="age" 
                        required 
                        value={formData.age} 
                        onChange={handleInputChange} 
                        placeholder="e.g. 32" 
                        className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-600 mb-1">Gender *</label>
                      <select 
                        name="gender" 
                        value={formData.gender} 
                        onChange={handleInputChange} 
                        className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none bg-white"
                      >
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-600 mb-1">Mobile Number *</label>
                    <input 
                      type="tel" 
                      name="mobile" 
                      required 
                      value={formData.mobile} 
                      onChange={handleInputChange} 
                      placeholder="10-digit mobile number" 
                      className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none"
                    />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-600 mb-1">WhatsApp Number</label>
                    <input 
                      type="tel" 
                      name="whatsapp" 
                      value={formData.whatsapp} 
                      onChange={handleInputChange} 
                      placeholder="Same as mobile or other" 
                      className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none"
                    />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-600 mb-1">Address (Pata)</label>
                    <input 
                      type="text" 
                      name="address" 
                      value={formData.address} 
                      onChange={handleInputChange} 
                      placeholder="City / Village / Locality" 
                      className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none"
                    />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-600 mb-1">Blood Group</label>
                    <select 
                      name="bloodGroup" 
                      value={formData.bloodGroup} 
                      onChange={handleInputChange} 
                      className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none bg-white"
                    >
                      <option value="">Select Blood Group</option>
                      <option value="A+">A+</option>
                      <option value="A-">A-</option>
                      <option value="B+">B+</option>
                      <option value="B-">B-</option>
                      <option value="O+">O+</option>
                      <option value="O-">O-</option>
                      <option value="AB+">AB+</option>
                      <option value="AB-">AB-</option>
                    </select>
                  </div>
                </div>
              </div>

              {/* SECTION 2: Medical History */}
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h2 className="text-sm font-bold text-red-600 flex items-center gap-2 border-b pb-2">
                  <i data-lucide="activity" className="w-4 h-4"></i> 2. Medical History (Purana Marj / Bimari)
                </h2>

                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
                  {['Diabetes (Sugar)', 'High BP', 'Heart Problem', 'Bleeding Disorder', 'Pregnancy', 'Drug Allergy'].map((disease) => (
                    <label key={disease} className="flex items-center gap-2 p-2 rounded-lg border bg-slate-50 cursor-pointer hover:bg-slate-100">
                      <input 
                        type="checkbox" 
                        checked={formData.medicalHistory.includes(disease)} 
                        onChange={() => handleCheckboxChange(disease)} 
                        className="rounded text-pink-600 focus:ring-pink-500 w-4 h-4"
                      />
                      <span className="font-medium text-slate-700">{disease}</span>
                    </label>
                  ))}
                </div>

                <div>
                  <label className="block font-semibold text-slate-600 mb-1 text-xs">Other Notes / Medical Issues:</label>
                  <input 
                    type="text" 
                    name="otherMedical" 
                    value={formData.otherMedical} 
                    onChange={handleInputChange} 
                    placeholder="E.g. Penicillin allergy" 
                    className="w-full p-2.5 text-xs border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none"
                  />
                </div>
              </div>

              {/* SECTION 3: Complaint & Treatment Plan */}
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h2 className="text-sm font-bold text-sky-600 flex items-center gap-2 border-b pb-2">
                  <i data-lucide="stethoscope" className="w-4 h-4"></i> 3. Complaint & Treatment Plan
                </h2>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-600 mb-1">Chief Complaint *</label>
                    <textarea 
                      name="chiefComplaint" 
                      required 
                      rows="2" 
                      value={formData.chiefComplaint} 
                      onChange={handleInputChange} 
                      placeholder="E.g. Daant me tej dard, thanda-garam lagna" 
                      className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none"
                    ></textarea>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-600 mb-1">Tooth No. (Daant Ka Number)</label>
                    <input 
                      type="text" 
                      name="toothNumber" 
                      value={formData.toothNumber} 
                      onChange={handleInputChange} 
                      placeholder="E.g. #16, #46" 
                      className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none"
                    />
                  </div>

                  <div className="md:col-span-2">
                    <label className="block font-semibold text-slate-600 mb-1">Planned Treatment *</label>
                    <select 
                      name="treatmentPlan" 
                      required 
                      value={formData.treatmentPlan} 
                      onChange={handleInputChange} 
                      className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none bg-white"
                    >
                      <option value="">Select Treatment</option>
                      <option value="Root Canal Treatment (RCT)">Root Canal Treatment (RCT)</option>
                      <option value="Tooth Extraction">Tooth Extraction</option>
                      <option value="Scaling & Polishing">Scaling & Polishing</option>
                      <option value="Dental Crown / Cap">Dental Crown / Cap</option>
                      <option value="Composite Filling">Composite Filling</option>
                      <option value="Denture">Denture</option>
                      <option value="Consultation Only">Consultation Only</option>
                    </select>
                  </div>
                </div>
              </div>

              {/* SECTION 4: Fees & Payment */}
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h2 className="text-sm font-bold text-emerald-600 flex items-center gap-2 border-b pb-2">
                  <i data-lucide="credit-card" className="w-4 h-4"></i> 4. Fee & Advance Payment
                </h2>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-600 mb-1">Total Estimated Fee (₹)</label>
                    <input 
                      type="number" 
                      name="totalFee" 
                      value={formData.totalFee} 
                      onChange={handleInputChange} 
                      placeholder="E.g. 2500" 
                      className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none"
                    />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-600 mb-1">Advance Paid (₹)</label>
                    <input 
                      type="number" 
                      name="advancePaid" 
                      value={formData.advancePaid} 
                      onChange={handleInputChange} 
                      placeholder="E.g. 500" 
                      className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none"
                    />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-600 mb-1">Payment Mode</label>
                    <select 
                      name="paymentMode" 
                      value={formData.paymentMode} 
                      onChange={handleInputChange} 
                      className="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-pink-500 outline-none bg-white"
                    >
                      <option value="Cash">Cash</option>
                      <option value="UPI / GPay / PhonePe">UPI / GPay / PhonePe</option>
                      <option value="Card">Card</option>
                    </select>
                  </div>
                </div>
              </div>

              {/* Submit Button */}
              <button 
                type="submit" 
                className="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 rounded-2xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2"
              >
                <i data-lucide="check-circle" className="w-5 h-5"></i> Save & Register Patient
              </button>

            </form>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NewPatientForm />);
  </script>
</body>
</html>
